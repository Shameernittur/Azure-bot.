name: matrix configuration

on: 
    push:
    workflow_dispatch:     
 
jobs: 
    deploy-on-ubuntu:
        strategy:
          fail-fast: true
          max-parallel: 3
          matrix:
            os: [ubuntu-latest, windows-latest, ubuntu-20.04]
            images: [hello-world,nginx]
            exclude:
              - images: nginx
                os:  windows-latest
            include:
              - images: amd64/alpine
                os: ubuntu-20.04
        runs-on: ${{matrix.os}}
        steps:
            - name: echo docker details
              run: docker info

            - name: run image on ${{matrix.os}}
              run: docker run ${{matrix.images}}
              

         